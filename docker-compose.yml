# COBRA-WATCH Docker Compose
# ==========================
# Brings up: backend (FastAPI) + frontend (Next.js) + video-pipeline (PyTorch/YOLOv8)
#
# SQLite note: single backend container, single writer — fine for demo/eval scale.
# SQLite does not handle concurrent writes at production scale — documented in report.
#
# Usage:
#   cp .env.example .env && nano .env   # fill in real API keys
#   docker-compose up --build
#
# The web app is accessible at http://localhost:3000
# The backend API is accessible at http://localhost:8000 (the browser calls it directly;
# CORS_ORIGINS in .env must include http://localhost:3000)

services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount the data directory so the SQLite DB persists across container restarts.
      # data/censys/ (the saved Censys aggregate snapshots) comes in with it.
      - ./data:/app/data
      # The image contains only backend/; mount the synthetic-benchmark results served by /api/results
      - ./paper/data:/app/paper_data:ro
    environment:
      # Default: the sanitized, /24-masked demo fixture (build it with scripts/build_demo_fixture.py, see README).
      # Override with COBRA_DATABASE_PATH=/app/data/surveillancewatch.db to use a private working database.
      - DATABASE_PATH=${COBRA_DATABASE_PATH:-/app/data/public.db}
      - CENSYS_DIR=/app/data/censys
      - RESULTS_JSON_PATH=/app/paper_data/results.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined at build time: must be the backend URL as the BROWSER sees it.
        NEXT_PUBLIC_COBRA_API_URL: ${NEXT_PUBLIC_COBRA_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      # /research reads the real Tier 2 run folders at request time (src/lib/content/real-tier2.ts looks in
      # <cwd>/eval/results). The image is built from frontend/ only, so mount them read-only.
      - ./eval/results:/app/eval/results:ro
    depends_on:
      backend:
        condition: service_healthy

  video-pipeline:
    build: ./video_pipeline
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
      - YOLO_MODEL=yolov8n.pt
      - VIDEO_PIPELINE_LOG=INFO
      # Pass the detection API key so the pipeline can POST events
      - DETECTION_API_KEY=${DETECTION_API_KEY:-}
    volumes:
      # Mount sample footage from the host into the container
      - ./video_pipeline/sample_footage:/app/sample_footage:ro
    # Restart on failure (e.g. backend not ready yet) — pipeline health-checks backend itself
    restart: on-failure
